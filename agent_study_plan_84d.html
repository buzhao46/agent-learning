function render(){
  const total = allDays.length;
  const completed = allDays.filter(d => done.has(d.d)).length;
  const pct = total ? Math.round(completed / total * 100) : 0;
  document.getElementById('pfill').style.width = pct + '%';
  document.getElementById('pnum').textContent = completed + ' / ' + total + '（' + pct + '%）';
  const hours = allDays.filter(d => done.has(d.d)).reduce((s, d) => s + d.h, 0);
  document.getElementById('hours').textContent = '已投入约 ' + hours.toFixed(1) + ' 小时';

  let html = '';
  PLAN.forEach(w => {
    if (curMonth && w.month !== curMonth) return;
    let daysHtml = '';
    let visible = false;
    w.days.forEach(d => {
      const isDone = done.has(d.d);
      if (onlyUndone && isDone) return;
      visible = true;
      const tag = d.tag ? '<span class="tag ' + tagClass(d.tag) + '">' + d.tag + '</span>' : '';
      daysHtml +=
        '<label class="day ' + (isDone ? 'done' : '') + '">' +
          '<input type="checkbox" data-d="' + d.d + '" ' + (isDone ? 'checked' : '') + '>' +
          '<span class="dnum">Day ' + d.d + '</span>' +
          '<div class="dmain">' +
            '<div class="dtitle">' + d.t + tag + '</div>' +
            '<div class="dtask">' + d.task + '</div>' +
            '<div class="dout">产出：' + d.out + '</div>' +
          '</div>' +
          '<span class="dh">' + d.h + 'h</span>' +
        '</label>';
    });
    if (!visible) return;
    html +=
      '<section class="week">' +
        '<div class="whead">' +
          '<span class="wnum">Week ' + w.week + '</span>' +
          '<span class="wgoal">' + w.goal + '</span>' +
          '<span class="wms">里程碑：' + w.milestone + '</span>' +
        '</div>' + daysHtml +
      '</section>';
  });
  document.getElementById('plan').innerHTML = html || '<div style="text-align:center;color:#94a3b8;padding:40px">没有符合条件的任务</div>';
}

document.getElementById('plan').addEventListener('change', function(e){
  if (!e.target.matches('input[type=checkbox]')) return;
  const d = Number(e.target.dataset.d);
  if (e.target.checked) done.add(d); else done.delete(d);
  localStorage.setItem(KEY, JSON.stringify([...done]));
  render();
});

document.querySelectorAll('.chip[data-m]').forEach(function(c){
  c.addEventListener('click', function(){
    curMonth = Number(c.dataset.m);
    document.querySelectorAll('.chip[data-m]').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    render();
  });
});

document.getElementById('undoneChip').addEventListener('click', function(){
  onlyUndone = !onlyUndone;
  this.classList.toggle('on', onlyUndone);
  render();
});

document.getElementById('resetBtn').addEventListener('click', function(){
  if (confirm('确定要清空所有打卡进度吗？')) {
    done = new Set();
    localStorage.removeItem(KEY);
    render();
  }
});

render();
</script>
</body>
</html>
